name: Release Fork Build

# 手动触发: 构建 Release 配置的 Mos.app (ad-hoc 签名, 不公证, 不含 Sparkle 更新源),
# 并创建 GitHub 草稿 Release. 发布草稿由人工在 GitHub 上完成.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in About, e.g. 4.3.0-fork.1"
        required: true
        default: "4.3.0-fork.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          xcodebuild -scheme Debug -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- 'CODE_SIGN_IDENTITY[sdk=macosx*]=-' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=MOS_FORK_BUILD \
            MARKETING_VERSION="${{ inputs.version }}" \
            build

      # 去掉上游更新源, 再重新做 ad-hoc 签名 (修改 Info.plist 会使签名失效)
      - name: Remove updater feed and re-sign
        run: |
          APP="build/DerivedData/Build/Products/Release/Mos.app"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :SUEnableAutomaticChecks bool false" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/DerivedData/Build/Products/Release/Mos.app" "build/Mos-${{ inputs.version }}.zip"
          shasum -a 256 "build/Mos-${{ inputs.version }}.zip"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "build/Mos-${{ inputs.version }}.zip" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Mos ${{ inputs.version }}" \
            --draft --prerelease \
            --notes "Fork build of Mos with per-device scroll overrides, per-setting inheritance, and per-app/per-device on/off.

          - Not notarized and ad-hoc signed: right-click Mos.app → Open on first launch, then grant Accessibility.
          - The built-in updater is disabled so it won't replace this build with upstream Mos.
          - Uses the same app ID as upstream Mos, so it reads your existing Mos settings."
