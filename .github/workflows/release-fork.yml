name: Release Fork Build

# 推送 v*-kingsley.* 标签触发: 构建 Release 配置的 Mos.app (ad-hoc 签名, 不公证, 不含 Sparkle 更新源),
# 并创建 GitHub 草稿 Release. 发布草稿由人工在 GitHub 上完成.
on:
  push:
    tags:
      - "v*-kingsley.*"

env:
  VERSION: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          xcodebuild -scheme Profile -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=MOS_FORK_BUILD \
            MARKETING_VERSION="${VERSION#v}" \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d).${{ github.run_number }}" \
            build

      # 去掉上游更新源, 再重新做 ad-hoc 签名 (修改 Info.plist 会使签名失效).
      # 不加 --options runtime: 强化运行时的库验证要求同一 Team ID, ad-hoc 签名没有 Team ID,
      # 开启后将无法加载内嵌的 Sparkle.framework. 强化运行时只在公证时必需.
      - name: Remove updater feed and re-sign
        run: |
          APP="build/DerivedData/Build/Products/Release/Mos.app"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :SUEnableAutomaticChecks bool false" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # 发布构建不得包含覆盖率插桩
          if otool -l "$APP/Contents/MacOS/Mos" | grep -q __llvm_prf; then echo "coverage instrumentation found" >&2; exit 1; fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Package
        run: |
          # 不打包资源分叉/扩展属性, 避免 ._* 文件解压后破坏框架签名
          ditto -c -k --norsrc --noextattr --keepParent "build/DerivedData/Build/Products/Release/Mos.app" "build/Mos-${VERSION#v}.zip"
          if unzip -l "build/Mos-${VERSION#v}.zip" | grep -qE '(^|/)\._|__MACOSX'; then echo "AppleDouble files in zip" >&2; exit 1; fi
          # 解压后的副本必须仍能通过签名校验
          mkdir -p build/verify && ditto -x -k "build/Mos-${VERSION#v}.zip" build/verify
          codesign --verify --deep --strict --verbose=2 build/verify/Mos.app
          shasum -a 256 "build/Mos-${VERSION#v}.zip"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "build/Mos-${VERSION#v}.zip" \
            --repo "${{ github.repository }}" \
            --title "Mos ${VERSION#v}" \
            --draft --prerelease \
            --notes "Fork build of Mos with per-device scroll overrides, per-setting inheritance, and per-app/per-device on/off.

          - Not notarized and ad-hoc signed: right-click Mos.app → Open on first launch, then grant Accessibility.
          - The built-in updater is disabled so it won't replace this build with upstream Mos.
          - Uses the same app ID as upstream Mos, so it reads your existing Mos settings."
